
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<script type="module"
src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
</script>

<style>
  body {
    margin: 0;
    background: #f6f3f3;
  }

  model-viewer {
    width: 100%;
    height: 480px;
    background: #f6f3f3;
  }
</style>
</head>

<body>

<model-viewer
  src="models/path.glb"
  alt="ONORICA PATH ring"
  camera-controls
  interaction-prompt="none"
  camera-orbit="35deg 70deg 115%"
  environment-image="neutral"
  exposure="1.4"
  shadow-intensity="0.3">
</model-viewer>

</body>
</html>
